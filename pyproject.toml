[project]
name = "emilie-agent"
version = "0.1.0"
description = "Terminal coding agent with an animated Emilie banner"
requires-python = ">=3.10"
dependencies = ["anthropic", "openai", "rich", "pillow", "prompt_toolkit", "numpy", "av", "pypdf"]

[project.scripts]
emilie = "emilie.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emilie*"]
namespaces = true      # the skills and locales folders hold data, not code: list them as packages so nothing is dropped

[tool.setuptools.package-data]
emilie = ["locales/*.json", "builtin/skills/*/SKILL.md", "builtin/skills/*/references/*", "builtin/skills/*/scripts/*",
          "builtin/skills/*/assets/*"]
